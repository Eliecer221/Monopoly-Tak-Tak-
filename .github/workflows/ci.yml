name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pruebas del motor (simulaciones)
        run: npm test
      - name: Pruebas de interfaz (jsdom)
        run: |
          npm install --no-save jsdom
          npm run test:ui
