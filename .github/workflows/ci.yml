name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        run: npm install
      - name: Pruebas del motor (simulaciones)
        run: npm run test:sim
      - name: Pruebas del servidor y la API
        run: npm run test:server
      - name: Pruebas de interfaz (jsdom)
        run: npm run test:ui
      - name: Pruebas de cuentas, tienda y pagos
        run: npm run test:store
      - name: Pruebas de plataforma (2FA, KYC, IA, retiros, bote)
        run: npm run test:platform
      - name: Pruebas de integración (interfaz + API)
        run: node test/integration.mjs
