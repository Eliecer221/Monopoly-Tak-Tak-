# Despliegue en Render (https://render.com) para Monopoly TAK TAK.
#
# Con este archivo, en Render basta con "New > Blueprint" y elegir este
# repositorio: el servicio, el comando de arranque y la ruta de salud ya
# vienen definidos. Solo hay que rellenar MONGODB_URI cuando Render lo pida.

services:
  - type: web
    name: monopoly-tak-tak
    runtime: node
    plan: free
    region: oregon
    branch: sistema-pagos-cuentas
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_DB
        value: monopoly_taktak
      # Se introducen en el panel de Render, nunca en el repositorio.
      - key: MONGODB_URI
        sync: false
      # Pagos reales. Sin estas claves la tienda avisa y no cobra nada.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
