name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: taktak
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TAKTAK_TEST_DB: postgres://postgres:ci@127.0.0.1:5432/taktak
      DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/taktak
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        run: npm install
      - name: Pruebas del motor (simulaciones)
        run: npm run test:sim
      - name: Pruebas del servidor y la API
        run: npm run test:server
      - name: Pruebas de interfaz (jsdom)
        run: npm run test:ui
      - name: Pruebas de cuentas, tienda y pagos
        run: npm run test:store
      - name: Pruebas de plataforma (2FA, KYC, IA, retiros, bote)
        run: npm run test:platform
      - name: Pruebas de integración (interfaz + API)
        run: node test/integration.mjs
      - name: Pruebas del cobro del operador
        run: npm run test:operator
      - name: Pruebas de Airtm, política y outbox
        run: npm run test:payments
      - name: Pruebas del libro contable (concurrencia real)
        run: npm run test:ledger
      - name: Pruebas del servidor con el libro contable
        run: npm run test:ledger:server
